# Compila la app de Android (sin firmar) cada vez que cambia la carpeta android/.
# El APK queda en la rama "apk-build"; se firma aparte con una llave que NO está en este repositorio.
name: APK MiBiblioteca
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compilar
        id: build
        working-directory: android
        env: { APK_VERSION_CODE: '${{ github.run_number }}' }
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publicar resultado en la rama apk-build
        if: always()
        run: |
          mkdir -p out && cp build.log out/ || true
          cp android/app/build/outputs/apk/release/*.apk out/MiBiblioteca-sin-firmar.apk 2>/dev/null || true
          echo "run=${{ github.run_number }} commit=${{ github.sha }} resultado=${{ steps.build.outcome }}" > out/estado.txt
          cd out && git init -q && git checkout -q -b apk-build
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-build
